[package]
name = "metal-perf"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Eugene Bokhan <eugenebokhan@icloud.com>"]
description = "Command-line instruments for Apple GPU (Metal) compute performance work"
readme = "README.md"
keywords = ["metal", "gpu", "profiling", "apple", "performance"]
categories = ["command-line-utilities", "development-tools::profiling"]
repository = "https://github.com/computer-graphics-tools/metal-perf"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
mtl-rs = "0.3"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
quick-xml = "0.42"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
